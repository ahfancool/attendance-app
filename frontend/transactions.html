<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Transaksi - Hotspot Wallet</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">HW</span>
          <div>
            <div>Riwayat Transaksi</div>
            <small class="muted">Monitor topup dan pembelian voucher</small>
          </div>
        </div>

        <nav class="nav">
          <a href="./dashboard.html">Dashboard</a>
          <a href="./wallet.html">Topup</a>
          <a class="active" href="./transactions.html">Riwayat</a>
          <a id="nav-admin" class="hidden" href="./admin.html">Admin</a>
          <button id="logout-btn" type="button">Logout</button>
        </nav>
      </header>

      <main class="layout">
        <section class="hero">
          <article class="panel hero-stat">
            <small class="kicker">User</small>
            <div class="panel-header">
              <h1 id="user-name">-</h1>
              <span id="role-badge" class="pill">Siswa</span>
            </div>
          </article>

          <article class="panel hero-stat">
            <small class="kicker">Data</small>
            <div class="actions">
              <button id="refresh-transactions" class="btn btn-soft" type="button">Refresh Riwayat</button>
            </div>
          </article>
        </section>

        <article class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Waktu</th>
                  <th>Jenis</th>
                  <th>Nominal</th>
                  <th>Status</th>
                  <th>Catatan</th>
                </tr>
              </thead>
              <tbody id="transactions-body"></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>

    <script type="module" src="./js/pages/transactions.page.js"></script>
  </body>
</html>
