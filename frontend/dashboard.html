<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard User - Hotspot Wallet</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">HW</span>
          <div>
            <div>Dashboard Voucher</div>
            <small class="muted">Aksi utama: Beli & Aktifkan 1 Klik</small>
          </div>
        </div>

        <nav class="nav">
          <a class="active" href="./dashboard.html">Dashboard</a>
          <a href="./wallet.html">Topup</a>
          <a href="./transactions.html">Riwayat</a>
          <a id="nav-admin" class="hidden" href="./admin.html">Admin</a>
          <button id="logout-btn" type="button">Logout</button>
        </nav>
      </header>

      <main class="layout">
        <section class="hero">
          <article class="panel hero-stat">
            <small class="kicker">Nama User</small>
            <div class="panel-header">
              <h1 id="user-name">-</h1>
              <span id="role-badge" class="pill">Siswa</span>
            </div>
            <small class="muted">Setelah beli voucher, sistem akan langsung redirect login hotspot otomatis.</small>
          </article>

          <article class="panel hero-stat">
            <small class="kicker">Saldo Koin</small>
            <div id="balance-value" class="stat-value">Rp 0</div>
            <small id="hotspot-hint" class="muted"></small>
          </article>
        </section>

        <article class="panel">
          <div class="panel-header">
            <h2>Pilih Paket Internet</h2>
            <button id="refresh-dashboard" type="button" class="btn btn-soft">Refresh</button>
          </div>
          <div id="packages-grid" class="grid"></div>
        </article>

        <article class="panel">
          <div class="panel-header">
            <h2>Voucher Saya</h2>
            <small class="muted">Klik tombol voucher untuk langsung online</small>
          </div>
          <div id="vouchers-grid" class="grid"></div>
        </article>
      </main>
    </div>

    <script type="module" src="./js/pages/dashboard.page.js"></script>
  </body>
</html>
